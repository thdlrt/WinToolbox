name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: uv sync --project core --group dev
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Run Python tests
        # Hosted runners expose no physical playback or microphone endpoint.
        run: core\.venv\Scripts\python.exe -m pytest tests -q -k "not test_cold_process_rpc_enumeration_and_capture_from_other_thread"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm.cmd ci
        working-directory: desktop
      - name: Build frontend
        run: npm.cmd run build
        working-directory: desktop
      - name: Check Rust desktop shell
        run: cargo check --locked
        working-directory: desktop/src-tauri
