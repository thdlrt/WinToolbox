[project]
name = "wintoolbox-core"
version = "0.1.20"
description = "Windows toolbox media and extensible job engine"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1", "websockets>=15,<16", "edge-tts>=7,<8",
  "tomlkit>=0.13,<1", "pypdfium2>=4.30,<6", "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2", "cryptography>=44,<47", "huggingface-hub>=0.34,<2",
  "numpy>=2.0,<3", "sounddevice>=0.5,<1", "soundfile>=0.13,<1",
  "soundcard>=0.4,<1", "websocket-client>=1.8,<2",
  "uv>=0.8,<1",
]

[project.scripts]
wintoolbox-core = "toolbox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolbox"]

[dependency-groups]
dev = ["pytest>=8,<10"]
